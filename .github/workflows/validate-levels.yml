name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch naming policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$BRANCH_NAME" == "codex" || "$BRANCH_NAME" == codex/* ]]; then
            echo "The codex/ branch prefix is prohibited."
            exit 1
          fi

          if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|chore|docs|test|release)/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Branch must use an approved prefix and lowercase kebab-case name."
            exit 1
          fi

  level-data:
    name: Level data and validator tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate level catalog
        run: python3 Tools/validate_levels.py

      - name: Test validator
        run: python3 -m unittest discover -s Tools/tests -v
